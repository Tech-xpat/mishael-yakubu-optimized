    <style>
      html, body {

        color: #fff;
        margin: 0;

      #root {

      /* Instant page skeleton: painted before any JavaScript runs.
         React replaces it the moment the app mounts. */
      #boot { position: fixed; inset: 0; z-index: 10000; background: #000; overflow: hidden; }
      #boot .b {
        border-radius: 4px;
        background: linear-gradient(90deg, rgba(255,255,255,.05) 25%, rgba(255,255,255,.1) 50%, rgba(255,255,255,.05) 75%);
        background-size: 200% 100%;
        animation: bootShimmer 1.5s infinite;
      }
      @keyframes bootShimmer { 0% { background-position: -200% 0 } 100% { background-position: 200% 0 } }
      #boot .nav { height: 80px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
      #boot .links { display: none; gap: 40px; }
      #boot .links .b { height: 12px; }
      #boot .hero { height: calc(100vh - 224px); min-height: 320px; padding: 0 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
      #boot .btns { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
      #boot .tiles { padding: 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; opacity: .6; }
      #boot .tiles .b { aspect-ratio: 1; border-radius: 24px; }
      @media (min-width: 768px) {
        #boot .nav { padding: 0 48px; }
        #boot .links { display: flex; }
        #boot .tiles { padding: 0 48px; gap: 24px; }
        #boot .btns { flex-direction: row; }
      }
      @media (prefers-reduced-motion: reduce) { #boot .b { animation: none } }
