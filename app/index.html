    <style>
      /* Theme variables. "white" = text colour, "black" = page colour: both flip in light mode,
         so every text-white / bg-black class on the site adapts. */
      :root {
        --c-white: 255 255 255;
        --c-black: 0 0 0;
        --t-black: 0 0 0; /* page colour that regions like .force-dark never override */
        --page-bg: #000;
        --key-shadow: 250 204 21; /* yellow key-button shadow */
        --key-edge: #ffffff;
        color-scheme: dark;
      }
      html[data-theme='light'] {
        --c-white: 10 10 10;
        --c-black: 245 245 242;
        --t-black: 245 245 242;
        --page-bg: #f5f5f2;
        --key-shadow: 0 0 0; /* black key-button shadow */
        --key-edge: #0a0a0a;
        color-scheme: light;
      }
      /* Regions that stay dark in either theme (hero photo, photo viewer) */
      .force-dark {
        --c-white: 255 255 255;
        --c-black: 0 0 0;
        --page-bg: #000;
        --key-shadow: 250 204 21;
        --key-edge: #ffffff;
        color-scheme: dark;
      }
    </style>
    <script>
      /* Apply the saved theme before first paint so there is no flash. Admin is always dark. */
      (function () {
        var t = 'dark';
        try {
          if (location.pathname.indexOf('/greatness') !== 0 && localStorage.getItem('theme') === 'light') t = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#f5f5f2' : '#000000');
      })();
    </script>

    <style>
      html, body {
        background-color: var(--page-bg) !important;
        color: rgb(var(--c-white));
        margin: 0;
        min-height: 100%;
      }
      #root {
        min-height: 100vh;
        background-color: var(--page-bg);
      }

      /* Instant page skeleton: painted before any JavaScript runs.
         React replaces it the moment the app mounts. */
      #boot { position: fixed; inset: 0; z-index: 10000; background: var(--page-bg); overflow: hidden; }
      #boot .b {
        border-radius: 4px;
        background: linear-gradient(90deg, rgb(var(--c-white) / .06) 25%, rgb(var(--c-white) / .12) 50%, rgb(var(--c-white) / .06) 75%);
        background-size: 200% 100%;
        animation: bootShimmer 1.5s infinite;
      }
      @keyframes bootShimmer { 0% { background-position: -200% 0 } 100% { background-position: 200% 0 } }
      #boot .nav { height: 80px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
      #boot .links { display: none; gap: 40px; }
      #boot .links .b { height: 12px; }
      #boot .hero { height: calc(100svh - 224px); min-height: 320px; padding: 0 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
      #boot .btns { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
      #boot .tiles { padding: 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; opacity: .6; }
      #boot .tiles .b { aspect-ratio: 1; border-radius: 24px; }
      @media (min-width: 768px) {
        #boot .nav { padding: 0 48px; }
        #boot .links { display: flex; }
        #boot .tiles { padding: 0 48px; gap: 24px; }
        #boot .btns { flex-direction: row; }
      }
      @media (prefers-reduced-motion: reduce) { #boot .b { animation: none } }
    </style>
  </head>
